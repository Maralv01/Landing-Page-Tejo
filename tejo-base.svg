<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B5A39"/>
      <stop offset="1" stop-color="#4E3521"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 230) rotate(90) scale(120 180)">
      <stop stop-color="#FFD36A" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FF8A1E" stop-opacity="0.85"/>
